<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            min-height: 100vh;
            padding: 40px 15px;
        }

        .login {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .main-heading {
            text-align: center;
            color: #1e40af;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 15px;
        }

        legend {
            color: #2563eb;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin-bottom: 9px;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.2);
        }

        select {
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 25px;
            padding: 22px;
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
            text-align: center;
        }

        .result h2 {
            color: #1e40af;
            font-size: 21px;
            margin-bottom: 12px;
        }

        .result p {
            color: #1d4ed8;
            font-size: 25px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .login {
                padding: 22px;
            }

            .main-heading {
                font-size: 23px;
            }

            legend {
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

    <div class="login">

        <h1 class="main-heading">
            Student Exam Performance Indicator
        </h1>

        <p class="subtitle">
            Enter your academic details to predict your mathematics score.
        </p>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <legend>Student Exam Performance Prediction</legend>

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select class="form-control" name="gender" required>
                    <option selected disabled value="">Select your Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Race or Ethnicity</label>

                <select class="form-control" name="ethnicity" required>
                    <option selected disabled value="">Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Parental Level of Education
                </label>

                <select class="form-control"
                    name="parental_level_of_education" required>

                    <option selected disabled value="">
                        Select Parent Education
                    </option>

                    <option value="associate's degree">
                        Associate's Degree
                    </option>

                    <option value="bachelor's degree">
                        Bachelor's Degree
                    </option>

                    <option value="high school">
                        High School
                    </option>

                    <option value="master's degree">
                        Master's Degree
                    </option>

                    <option value="some college">
                        Some College
                    </option>

                    <option value="some high school">
                        Some High School
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Lunch Type</label>

                <select class="form-control" name="lunch" required>
                    <option selected disabled value="">
                        Select Lunch Type
                    </option>

                    <option value="free/reduced">
                        Free/Reduced
                    </option>

                    <option value="standard">
                        Standard
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Test Preparation Course
                </label>

                <select class="form-control"
                    name="test_preparation_course" required>

                    <option selected disabled value="">
                        Select Test Course
                    </option>

                    <option value="none">None</option>
                    <option value="completed">Completed</option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Reading Score (out of 100)
                </label>

                <input class="form-control"
                    type="number"
                    name="reading_score"
                    placeholder="Enter your Reading Score"
                    min="0"
                    max="100"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Writing Score (out of 100)
                </label>

                <input class="form-control"
                    type="number"
                    name="writing_score"
                    placeholder="Enter your Writing Score"
                    min="0"
                    max="100"
                    required>
            </div>

            <div class="mb-3">
                <input class="btn-primary"
                    type="submit"
                    value="Predict Your Maths Score">
            </div>

        </form>

        {% if results is not none %}
        <div class="result">
            <h2>Prediction Result</h2>
            <p>{{ results }}</p>
        </div>
        {% endif %}

        <div class="footer">
            Data Science Project | Student Exam Performance Indicator
        </div>

    </div>

</body>
</html>
